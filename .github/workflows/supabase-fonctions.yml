# Met en ligne les fonctions de paiement (Stripe) sur Supabase.
# Il faut le secret SUPABASE_ACCESS_TOKEN dans Settings > Secrets and variables > Actions.
name: Fonctions Supabase
on:
  push:
    branches: [main, claude/project-thread-81x7q5]
    paths: ['backend/supabase/functions/**', 'backend/supabase/config.toml', '.github/workflows/supabase-fonctions.yml']
  workflow_dispatch:
jobs:
  deployer:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJET: ejpzgvizznylfgzxngut
    steps:
      - name: Jeton présent ?
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Ajoutez le secret SUPABASE_ACCESS_TOKEN dans les réglages du dépôt."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: supabase functions deploy paiement --project-ref "$PROJET"
        working-directory: backend
      - run: supabase functions deploy stripe-webhook --project-ref "$PROJET" --no-verify-jwt
        working-directory: backend
